<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | Ryleigh Shikhanova</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <nav>
        <a href="/">Home</a>
        <a href="/blog/">Blog</a>
    </nav>

    <main class="blog-post">

        <article>
            <h1>{{ page.title }}</h1>

            <p class="blog-date">
                {{ page.date | date: "%B %d, %Y" }}
            </p>

            {{ content }}

        </article>

    </main>

</body>

</html>
